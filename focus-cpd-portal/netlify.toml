[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."issue-certificate"]
  included_files = ["netlify/functions/assets/**"]

# SPA fallback — function routes (/.netlify/functions/*) are handled before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
